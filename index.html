<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tempo LAB — Workforce &amp; Shift Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
  <!-- Full-Page Login / Registration Outlet -->
  <section id="loginScreen" class="auth-screen"></section>

  <!-- Main Authenticated Application Shell -->
  <div id="appShell" class="app-shell hidden">
    <div id="mobileNavBackdrop" class="mobile-nav-backdrop" data-action="close-mobile-nav"></div>

    <!-- Left Navigation Rail -->
    <aside id="sidebar" class="sidebar" aria-label="Primary Navigation">
      <div class="sidebar-top">
        <button
          id="sidebarToggleBtn"
          class="minimize-btn"
          type="button"
          data-action="toggle-sidebar"
          title="Collapse or expand navigation"
        >
          <span class="minimize-label">Minimize</span>
          <svg class="icon-sm" viewBox="0 0 24 24">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>

        <div class="brand-logo" data-action="navigate" data-page="home" role="button" tabindex="0">
          <span class="brand-text">Tempo</span>
          <span class="brand-badge">LAB</span>
        </div>

        <nav class="nav-menu">
          <button class="nav-item" type="button" data-action="navigate" data-page="home">
            <svg class="icon-nav" viewBox="0 0 24 24">
              <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z" />
            </svg>
            <span class="nav-label">Home</span>
          </button>

          <button class="nav-item" type="button" data-action="navigate" data-page="dashboard">
            <svg class="icon-nav" viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
            </svg>
            <span class="nav-label">Dashboard</span>
          </button>

          <button class="nav-item active" type="button" data-action="navigate" data-page="shifts">
            <svg class="icon-nav" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span class="nav-label">Shifts</span>
          </button>

          <button class="nav-item" type="button" data-action="navigate" data-page="employees">
            <svg class="icon-nav" viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span class="nav-label">Employees</span>
          </button>

          <button class="nav-item" type="button" data-action="logout">
            <svg class="icon-nav" viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span class="nav-label">Sign Out</span>
          </button>
        </nav>
      </div>

      <button
        id="userProfileBtn"
        class="sidebar-footer"
        type="button"
        data-action="logout"
        title="Switch account or sign out"
      >
        <div id="sidebarUserAvatar" class="user-avatar-badge">V</div>
        <div class="user-name-label user-meta-stack">
          <span id="sidebarUserName">Virk</span>
          <span id="sidebarUserRoleChip" class="role-chip-sidebar manager">Manager</span>
        </div>
      </button>
    </aside>

    <!-- Sliding Advanced Filter Panel Host -->
    <aside id="advancedFilterPanel" class="filter-panel hidden" aria-label="Advanced Filters"></aside>

    <!-- Main Content Board -->
    <main class="main-board">
      <header id="workspaceToolbar" class="top-toolbar">
        <div class="toolbar-left">
          <button
            id="mobileMenuBtn"
            class="mobile-menu-btn"
            type="button"
            data-action="toggle-mobile-nav"
            aria-label="Open menu"
          >
            <svg class="icon-sm" viewBox="0 0 24 24">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>

          <div id="scheduleControlsLeft" class="controls-cluster">
            <div class="segmented-control" role="tablist">
              <button class="seg-btn active" type="button" data-action="set-view" data-view="shift">
                <svg class="icon-xs" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="9" />
                  <polyline points="12 7 12 12 15 15" />
                </svg>
                <span>Shift view</span>
              </button>
              <button class="seg-btn" type="button" data-action="set-view" data-view="staff">
                <svg class="icon-xs" viewBox="0 0 24 24">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                </svg>
                <span>Staff view</span>
              </button>
            </div>

            <div id="quickFilterPills" class="quick-pills-cluster">
              <button class="pill-btn" type="button" data-action="cycle-quick-status">
                <span>Status <strong id="quickStatusLabel">All</strong></span>
              </button>

              <button class="pill-btn" type="button" data-action="cycle-quick-team">
                <span>Team <strong id="quickTeamLabel">All</strong></span>
              </button>

              <button class="adv-filter-link" type="button" data-action="toggle-filter-panel">
                + Advanced filter
              </button>
            </div>
          </div>
        </div>

       <div id="scheduleControlsRight" class="toolbar-right">
          <div class="segmented-control">
            <button class="seg-btn active" type="button" data-action="set-period" data-period="week">
              Week
            </button>
            <button class="seg-btn" type="button" data-action="set-period" data-period="month">
              Month
            </button>
          </div>

          <div class="week-stepper-pill" role="group" aria-label="Week navigation">
            <button
              class="week-step-btn"
              type="button"
              data-action="prev-week"
              title="Previous week"
            >
              ‹
            </button>
            <button
              class="week-label-btn"
              type="button"
              data-action="reset-today"
              title="Jump back to Current Week (W33)"
            >
              <strong id="currentWeekLabel">Current Week</strong>
            </button>
            <button
              class="week-step-btn"
              type="button"
              data-action="next-week"
              title="Next week"
            >
              ›
            </button>
          </div>
        </div>
      </header>

      <div id="toastBanner" class="toast-banner hidden" role="status" aria-live="polite"></div>
      <section id="workspaceContent" class="workspace-content"></section>

      <!-- Role-Aware Floating Action Button & Quick-Action Popover -->
      <div class="fab-anchor">
        <div id="fabPopover" class="fab-popover hidden" role="menu"></div>
        <button
          id="fabTriggerBtn"
          class="fab-btn"
          type="button"
          data-action="toggle-fab-menu"
          aria-label="Quick Actions"
        >
          <svg id="fabPlusIcon" class="icon-fab" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </div>
    </main>
  </div>

  <!-- Slide-Over Drawer Backdrop & Outlet -->
  <div id="drawerBackdrop" class="drawer-backdrop hidden" data-action="close-drawer">
    <aside
      id="drawerContainer"
      class="slide-drawer"
      role="dialog"
      aria-modal="true"
      onclick="event.stopPropagation()"
    ></aside>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
